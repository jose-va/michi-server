spring.application.name=reservations
server.port=${PORT:8082}
app.frontend-url=${FRONTEND_URL}
spring.data.mongodb.uri=${MONGODB_URI}

spring.jackson.time-zone=UTC

app.mail.from=${MAIL_FROM:reservas@michisushigranada.es}
app.mail.reply-to=${MAIL_REPLY_TO:michisushigranada@gmail.com}
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.data.mongodb.auto-index-creation=true
server.error.include-message=always

push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
push.vapid.subject=${VAPID_SUBJECT:mailto:michisushigranada@gmail.com}

ycloud.base-url=https://api.ycloud.com/v2
ycloud.api-key=${YCLOUD_API_KEY:}
ycloud.from-number=${YCLOUD_FROM_NUMBER:+34673821148}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:reservation}
whatsapp.language=${WHATSAPP_LANGUAGE:es}
whatsapp.header-image-url=${WHATSAPP_HEADER_IMAGE_URL:https://michisushigranada.es/logos/reservation_confirm.jpg}



