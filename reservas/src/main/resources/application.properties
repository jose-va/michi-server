spring.application.name=reservations
server.port=${PORT:8082}

spring.data.mongodb.uri=${MONGODB_URI}
spring.jackson.time-zone=UTC

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.socketFactory.port=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SOCKETFACTORY_PORT:587}
spring.mail.properties.mail.smtp.socketFactory.class=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SOCKETFACTORY_CLASS:}
spring.mail.properties.mail.smtp.socketFactory.fallback=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SOCKETFACTORY_FALLBACK:true}

