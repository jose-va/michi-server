spring.application.name=reservations
server.port=${PORT:8082}
app.frontend-url=${FRONTEND_URL}
spring.data.mongodb.uri=${MONGODB_URI}

spring.jackson.time-zone=UTC

app.mail.from=${MAIL_FROM:reservas@michisushigranada.es}
app.mail.reply-to=${MAIL_REPLY_TO:michisushigranada@gmail.com}
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.data.mongodb.auto-index-creation=true
server.error.include-message=always

whatsapp.base-url=https://graph.facebook.com/v25.0
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.template-name=hello_world
whatsapp.language=es
whatsapp.header-image-url=https://michisushigranada.es/images/reservation_confirm.jpg



