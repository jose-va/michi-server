<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserva Confirmada</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #333; font-family: Roboto, Arial, sans-serif; }
        .wrapper { max-width: 600px; margin: 0 auto; background: #fff; }
        .header { padding: 20px; text-align: center; border-bottom: 1px solid #ccc; }
        .header img { width: 250px; height: auto; }
        .body { padding: 30px 20px; text-align: center; }
        .body h1 { font-family: 'Times New Roman', serif; font-weight: normal; font-size: 30px; color: #333; margin: 10px 0; }
        .body p { font-size: 16px; color: #333; line-height: 1.5; margin: 10px 0; }
        .btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #bbe8e1; color: #272643; border-radius: 3px; text-decoration: none; font-size: 15px; }
        .details { margin: 20px; background: #f9f9f9; border-radius: 6px; text-align: left; overflow: hidden; }
        .detail-row { padding: 12px 20px; border-top: 1px solid #eee; }
        .detail-row:first-child { border-top: none; }
        .detail-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 2px; }
        .detail-value { font-size: 16px; color: #333; font-weight: bold; margin: 0; }
        .footer { background: #fafafa; border-top: 1px solid #ccc; padding: 15px 20px; text-align: center; }
        .footer-links a { font-size: 14px; color: #333; text-decoration: none; margin: 0 10px; }
        .footer-divider { border: none; border-top: 1px solid #ccc; margin: 10px 0; }
        .footer-icons { margin-top: 10px; }
        .footer-icons a { display: inline-block; margin: 0 5px; }
    </style>
</head>
<body>
<div class="wrapper">

    <div class="header">
        <img src="https://res.cloudinary.com/drhqpksqc/image/upload/q_auto/f_auto/v1779789346/logo_michi_ikgltr.png" alt="Michi Café & Sushi Bar">
    </div>

    <div class="body">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" stroke="#333" stroke-width="2"/>
            <line x1="20" y1="8" x2="20" y2="20" stroke="#333" stroke-width="2" stroke-linecap="round"/>
            <line x1="20" y1="20" x2="28" y2="26" stroke="#333" stroke-width="2" stroke-linecap="round"/>
            <circle cx="20" cy="20" r="2" fill="#333"/>
        </svg>
        <h1>Su reserva ha sido confirmada</h1>
        <p>Gracias por confiar en nosotros, le estaremos esperando.<br>A continuación puede visualizar nuestra carta</p>
        <a href="https://drive.google.com/file/d/1QdWtr490JNchaeqt4NpXElYDW_xKYeHa/view" class="btn">Nuestra carta</a>
    </div>

    <div class="details">
        <div class="detail-row">
            <p class="detail-label">Nombre</p>
            <p class="detail-value" th:text="${guestName}"></p>
        </div>
        <div class="detail-row">
            <p class="detail-label">Fecha y hora</p>
            <p class="detail-value" th:text="${#temporals.format(startTime, 'dd/MM/yyyy HH:mm')}"></p>
        </div>
        <div class="detail-row">
            <p class="detail-label">Número de invitados</p>
            <p class="detail-value" th:text="${guestCount}"></p>
        </div>
        <div class="detail-row">
            <p class="detail-label">Ubicación</p>
            <p class="detail-value" th:text="${location}"></p>
        </div>
    </div>

    <div class="footer">
        <div class="footer-links">
            <a href="https://api.whatsapp.com/send/?phone=34673821148">CONTACTO</a>
            <a href="google.com/maps/place/Michi+Café+%26+Sushi+Bar/@37.19737,-3.6047432,867m/data=!3m2!1e3!4b1!4m6!3m5!1s0xd71fd0d546fef3f:0xbae9bb74146df83e!8m2!3d37.19737!4d-3.6021683!16s%2Fg%2F11zj68qb3j?entry=tts&g_ep=EgoyMDI1MTEyMy4xIPu8ASoASAFQAw%3D%3D&skid=bcbe673a-42bc-43ba-826d-4025a9f93496">UBICACIÓN</a>
        </div>
        <hr class="footer-divider">
        <div class="footer-icons">
            <a href="https://instagram.com/michisushigranada" target="_blank">
                <img src="https://res.cloudinary.com/drhqpksqc/image/upload/q_auto/f_auto/v1779789346/logo_instagram_lvywlf.png" alt="Instagram" width="36" height="36">
            </a>
            <a href="https://api.whatsapp.com/send/?phone=34673821148" target="_blank">
                <img src="https://res.cloudinary.com/drhqpksqc/image/upload/q_auto/f_auto/v1779789346/logo_whatsapp_eefedk.png" alt="Whatsapp" width="36" height="36">
            </a>
        </div>
    </div>

</div>
</body>
</html>
