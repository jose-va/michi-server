server.port=${PORT:8080}
spring.application.name=michi-gateway

app.frontend.url=${FRONTEND_URL}
jwt.secret=${JWT_SECRET}

spring.cloud.gateway.server.webflux.routes[0].id=michi-products
spring.cloud.gateway.server.webflux.routes[0].uri=${PRODUCTS_URL}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/products,/products/**

spring.cloud.gateway.server.webflux.routes[1].id=michi-reservations
spring.cloud.gateway.server.webflux.routes[1].uri=${RESERVATIONS_URL}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/reservations,/reservations/**

spring.cloud.gateway.server.webflux.routes[2].id=michi-oauth
spring.cloud.gateway.server.webflux.routes[2].uri=${OAUTH_URL}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/auth,/auth/**